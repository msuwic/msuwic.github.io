<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Sign Up | MSU WiC</title>

  <link rel="stylesheet" href="assets/css/bootstrap.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <div class="container" style="max-width:560px; margin-top:80px;">
    <h2>Create Account</h2>

    <form id="signupForm">
      <div class="form-group">
        <label>Full name</label>
        <input id="fullName" class="form-control" required />
      </div>

      <div class="form-group">
        <label>Major</label>
        <input id="major" class="form-control" />
      </div>

      <div class="form-group">
        <label>Graduation year</label>
        <input id="gradYear" class="form-control" type="number" min="2020" max="2100" />
      </div>

      <hr />

      <div class="form-group">
        <label>Email</label>
        <input id="email" class="form-control" type="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="password" class="form-control" type="password" minlength="6" required />
      </div>

      <button class="btn btn-primary" type="submit">Sign up</button>

      <p style="margin-top:12px;">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </form>

    <p id="msg" style="margin-top:12px;"></p>
  </div>

  <script>
    const msg = document.getElementById("msg");

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const profile = {
        full_name: document.getElementById("fullName").value.trim(),
        major: document.getElementById("major").value.trim(),
        grad_year: document.getElementById("gradYear").value ? Number(document.getElementById("gradYear").value) : null
      };

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await window.signUp(email, password);

        // Save profile locally; you’ll upsert it after they confirm + log in
        localStorage.setItem("pendingProfile", JSON.stringify(profile));

        msg.textContent = data.session
          ? "Account created! Redirecting..."
          : "Account created! Check your email to confirm. Then log in to finish setup.";

        if (data.session) window.location.href = "dashboard.html";
      } catch (err) {
        console.error(err);
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
