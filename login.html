<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Login | MSU WiC</title>

  <link rel="stylesheet" href="assets/css/bootstrap.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <div class="container" style="max-width:520px; margin-top:80px;">
    <h2>Login</h2>

    <form id="authForm">
      <div class="form-group">
        <label>Email</label>
        <input id="email" class="form-control" type="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" class="form-control" type="password" minlength="6" required />
      </div>

      <button class="btn btn-primary" type="submit">Log in</button>
      <p style="margin-top:12px;">
        Don't have an account?
        <a href="signup.html">Sign up</a>
      </p>
    </form>

    <p id="msg" style="margin-top:12px;"></p>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      try {
        await signIn(email.value, password.value);
        window.location.href = "dashboard.html";
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    document.getElementById("signupBtn").addEventListener("click", async () => {
      msg.textContent = "";
      try {
        const data = await signUp(email.value, password.value);
        msg.textContent = data.session
          ? "Account created! Redirecting..."
          : "Account created! Check your email to confirm, then log in.";
        if (data.session) window.location.href = "dashboard.html";
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
